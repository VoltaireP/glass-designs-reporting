  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iters,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function tryKey(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  const html=new TextDecoder().decode(pt);
  // document.write only REPLACES the page once parsing has finished. Called while the
  // document is still loading (the remembered-key path, which fires during initial
  // parse) it INSERTS at the parser position instead, leaving the unlock box to be
  // parsed in afterwards -> content and password box both on screen. So wait for
  // parsing to complete first. Keeping document.write (rather than swapping nodes)
  // means the content's own Content-Security-Policy meta tag is parsed and enforced.
  const render=()=>{document.open();document.write(html);document.close();};
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",render,{once:true});
  }else{render();}
}
async function boot(){
  const saved=localStorage.getItem("gd_gate_key");
  if(saved){try{
    const key=await crypto.subtle.importKey("raw",b64(saved),{name:"AES-GCM"},true,["decrypt"]);
    await tryKey(key);return;
  }catch(e){localStorage.removeItem("gd_gate_key");}}
  document.getElementById("f").addEventListener("submit",async ev=>{
    ev.preventDefault();
    const btn=document.getElementById("go");btn.disabled=true;
    try{
      const key=await keyFromPw(document.getElementById("pw").value);
      if(document.getElementById("rem").checked){
        const raw=await crypto.subtle.exportKey("raw",key);
        localStorage.setItem("gd_gate_key",btoa(String.fromCharCode(...new Uint8Array(raw))));
      }
      await tryKey(key);
    }catch(e){
      localStorage.removeItem("gd_gate_key");
      document.getElementById("err").style.display="block";btn.disabled=false;
    }
  });
}
boot();
</script></body></html>
